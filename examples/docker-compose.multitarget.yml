# Elevarq Signals multi-target local validation (#347) — LOCAL DEV ONLY
#
# Two independent PostgreSQL instances, one Signals collector monitoring
# BOTH via a `targets:` list. The config it mounts at
# /etc/signals/signals.yaml is RENDERED FROM THE HELM CHART by
# examples/multitarget-snapshot.sh (helm template ... > .rendered-...),
# so this exercises the actual #347 chart artifact end-to-end, not a
# hand-written config.
#
# Do not run this directly — use:  examples/multitarget-snapshot.sh
# (it renders the config first; a bare `up` would bind-mount a missing
# file as a directory).

services:
  signals:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # pg-primary is the single `target` (renders password_env: PG_PASSWORD);
      # pg-analytics is a `targets:` list entry (password_env: PG_PASSWORD_ANALYTICS).
      # Both databases share init.sql's `signals`/`monitor_pass` role.
      PG_PASSWORD: monitor_pass
      PG_PASSWORD_ANALYTICS: monitor_pass
      SIGNALS_API_TOKEN: dev-local-only-replace-in-prod-32chars
      SIGNALS_LISTEN_ADDR: "0.0.0.0:8081"
      SIGNALS_ALLOW_INSECURE_PG_TLS: "true"
      SIGNALS_ENV: dev
      SIGNALS_POLL_INTERVAL: 1m
    ports:
      - "8081:8081"
    volumes:
      - signals-data:/data
      # Chart-rendered multi-target config (generated by the runner).
      - ./.rendered-multitarget-signals.yaml:/etc/signals/signals.yaml:ro
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-analytics:
        condition: service_healthy

  pg-primary:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  pg-analytics:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  signals-data:
