{{- if .Values.postgres.caCert }}
kind: secret
name: {{ include "signals.ca.name" . }}
description: PEM CA bundle used to verify the PostgreSQL server certificate
tags:
  {{- include "signals.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    {{- .Values.postgres.caCert | nindent 4 }}
{{- end }}
