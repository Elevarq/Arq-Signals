# =============================================================================
# Elevarq Signals — Control Plane Catalog template values
# =============================================================================
# Signals is a read-only PostgreSQL diagnostic collector. It connects to an
# existing PostgreSQL database that YOU supply, collects statistics with an
# approved read-only SQL set, and stores snapshot history in an embedded SQLite
# database on a local volume; portable `signals-snapshot` ZIP archives are served
# on demand via the API (optional scheduled drop-to-disk is off by default).
# Signals initiates no outbound telemetry and no automatic upload; snapshots stay
# on the workload until you retrieve them. There is no AI in Signals.
#
# The values below are PLACEHOLDERS so the chart renders for catalog validation.
# You MUST override the required inputs (postgres.host/user/password, api.token,
# postgres.caCert) — the placeholders are intentionally non-functional and
# fail-closed (the default api.token is rejected by Signals at startup).
#
# The image is pinned by immutable digest and is enforced: the chart only deploys
# the exact reviewed image (ghcr.io/elevarq/signals:1.3.0 multi-arch index —
# linux/amd64 + linux/arm64, cosign-signed with an attached SPDX SBOM). Changing
# image.repository/digest is rejected.
image:
  repository: ghcr.io/elevarq/signals
  tag: "1.3.0"                 # informational only; the digest is what deploys
  digest: "sha256:76aeda85f41ee716797535824c62dee72b5524d98267deacf589983b9a6feadc"

# ---------------------------------------------------------------------------
# Resource sizing (Signals is lightweight — a Go binary + embedded SQLite).
# ---------------------------------------------------------------------------
resources:
  cpu: 100m       # request/reservation; Signals idles well under this
  memory: 128Mi   # covers the default 4 concurrent targets + export buffering

# ---------------------------------------------------------------------------
# PostgreSQL target — the customer's EXISTING database (nothing is bundled).
# Signals needs only a read-only role (e.g. `GRANT pg_monitor TO signals`).
# ---------------------------------------------------------------------------
postgres:
  name: "default"                 # logical target name shown in snapshots
  host: "postgres.example.com"    # REQUIRED — override with your PostgreSQL host/IP
  port: 5432
  database: "postgres"            # database to connect to
  user: "signals"                 # REQUIRED — read-only role (see README: minimum grants)
  password: "REPLACE_WITH_DB_PASSWORD"  # REQUIRED — override; stored in a Control Plane secret
  # TLS to PostgreSQL. The workload runs with SIGNALS_ENV=prod, which requires a
  # verifying mode with a CA cert — `verify-full` (default) or `verify-ca`.
  # Weaker modes (require / prefer / disable) are rejected by Signals in prod.
  sslMode: "verify-full"
  # PEM CA bundle — REQUIRED (verify-full/verify-ca need it to verify the server
  # certificate). REPLACE the placeholder with the real bundle. For managed
  # PostgreSQL use the provider bundle, e.g. Amazon RDS:
  # https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
  # Stored in a Control Plane opaque secret and mounted read-only into the workload.
  caCert: "REPLACE_WITH_PEM_CA_BUNDLE"

# ---------------------------------------------------------------------------
# Signals HTTP API (bearer-token protected; used to trigger collection and
# download snapshot exports). Reachable in-GVC at
# signals.<gvc>.cpln.local:8081 by default (see firewall.internal).
# ---------------------------------------------------------------------------
api:
  # REQUIRED — bearer token for the API. Must be >= 32 chars with >= 8 distinct
  # characters (enforced by Signals in prod). REPLACE the placeholder; generate:
  #   openssl rand -base64 32
  # The default below is a deliberate fail-closed sentinel: it renders (so catalog
  # validation passes) but Signals REJECTS it at startup (only 1 distinct char),
  # so a workload deployed without a real token fails to start rather than exposing
  # its API under a public, predictable token. Stored in a Control Plane secret.
  token: "00000000000000000000000000000000"

# ---------------------------------------------------------------------------
# Collection behaviour.
# ---------------------------------------------------------------------------
collection:
  pollInterval: "5m"   # time between collection cycles (e.g. 5m, 1h)
  retentionDays: 30    # days of snapshots retained in the local SQLite store
  # High-sensitivity collectors — OFF BY DEFAULT (data minimization).
  # When true, snapshots may include LIVE QUERY TEXT (pg_stat_activity) and stored
  # SQL bodies (view / trigger / function definitions), which can contain literals
  # or PII. Leave false to collect statistics/metadata only; set true ONLY if you
  # deliberately want that content captured in snapshots.
  highSensitivityCollectorsEnabled: false

# ---------------------------------------------------------------------------
# Snapshot export.
# Signals ALWAYS serves snapshots on demand via the API (GET /export, bearer) —
# that is the primary, always-available way to retrieve them; nothing below is
# needed for it.
#
# onCollect is an OPT-IN extra: when true, Signals ALSO drops one ZIP per database
# into `dest` after every collection cycle. It is OFF BY DEFAULT because the
# dropped files are timestamped and ACCUMULATE — Signals does not prune them, so
# on the default 5-minute cadence they grow the volume without bound and can
# eventually fill it (impairing both exports and the SQLite state).
#
# Enable it ONLY if you have somewhere to send the files (e.g. a sidecar that
# syncs `dest` to object storage) and you prune them, or you size storage.capacity
# for your cadence/retention. `dest` must be on the persistent volume (/data...);
# the directory is created automatically. Native retention is tracked upstream.
# ---------------------------------------------------------------------------
export:
  onCollect: false
  dest: "/data/exports"

# debug | info | warn | error
logLevel: "info"

# Prometheus /metrics endpoint (operational metrics only — never collected DB
# data). Served on the API port behind the same bearer token when enabled.
metrics:
  enabled: false

# ---------------------------------------------------------------------------
# Local persistence for the snapshot store (SQLite at /data/signals.db) plus
# any dropped exports. Control Plane volumesets have a 10 GiB minimum;
# high-throughput-ssd requires >= 200 GiB.
# ---------------------------------------------------------------------------
storage:
  capacity: 10                          # GiB (>= 10; >= 200 for high-throughput-ssd)
  performanceClass: general-purpose-ssd # general-purpose-ssd | high-throughput-ssd

# ---------------------------------------------------------------------------
# Firewall.
# Egress is restricted to TCP on the PostgreSQL port (postgres.port) via
# outboundAllowPort (emitted by the workload template). The destination CIDR
# defaults to 0.0.0.0/0 because a CIDR rule needs a stable database IP and managed
# PostgreSQL IPs often rotate (Control Plane hostname rules only permit ports
# 80/443/445, so they can't scope a 5432 connection). If your database has a
# stable address, also narrow outboundAllowCIDR to it.
# Inbound is limited to the same GVC so other workloads can call the Signals API.
# ---------------------------------------------------------------------------
firewall:
  internal:
    inboundAllowType: same-gvc   # none | same-gvc | same-org | workload-list
    workloads: []
  external:
    outboundAllowCIDR:
      - 0.0.0.0/0                # narrow to the database CIDR when it is stable

# Injected by the platform when createsGvc is false.
global:
  cpln:
    gvc: ""
